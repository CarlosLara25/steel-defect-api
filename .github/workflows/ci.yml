name: CI-CD 

on: 
  push:
  pull_request:

permissions:
  contents: read    

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run linting
        run: ruff check .    
      
      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t steel-defect-api:ci .

      - name: Run container
        run: |
          docker run -d \
            --name steel-defect-api-ci \
            -p 8000:8000 \
            -e API_KEY=test-key \
            steel-defect-api:ci

        run: 

      - name: Health check
        run: |
          sleep 5
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/health

      - name: Stop container
        if: always()
        run: docker rm -f steel-defect-api-ci || true

    publish:
      name: Publish Docker image

      needs: ci

      if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      runs-on: ubuntu-latest

      permisions:
        contents: read
        id-token: write

      steps:

        - name: Checkout repository
          uses: actions/checkout@v4
          
        - name: Authenticate to Google Cloud
          uses: google-github-actions/auth@v3
          with:
            workload_identity_provider: projects/224196183004/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            service_account: github-actions-publisher@steel-defects-classifier-01.iam.gserviceaccount.com

        - name: Set up Google Cloud CLI
          uses: google-github-actions/setup-gcloud@v3

        - name: Configure Docker authentication
          run: |
            gcloud auth configure-docker \
              us-south1-docker.pkg.dev \
              --quiet

        - name: Build release image
          run: |
            docker build \
              -t us-south1-docker.pkg.dev/steel-defects-classifier-01/steel-defect-api/steel-defect-api:v0.6.0 \
              .
