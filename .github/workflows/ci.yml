name: CI 

on: 
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run linting
        run: ruff check .    
      
      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t steel-defect-api:ci .

      - name: Run container
        run: |
          docker run -d \
            --name steel-defect-api-ci \
            -p 8000:8000 \
            -e API_KEY=test-key \
            steel-defect-api:ci

      - name: Wait for API
        run: sleep 5

      - name: Health check
        run: curl --fail http://127.0.0.1:8000/health

      - name: Stop container
        if: always()
        run: docker rm -f steel-defect-api-ci
